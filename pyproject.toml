[project]
name = "airbi"
version = "0.1.0"
description = "Airbnb BI-Tool — Slice 1 (Marvila)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "shapely>=2.0",
    "pydantic-settings>=2.0",
    "playwright>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
airbi = "airbi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airbi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
